[tool.poetry]
name = "nawminator"
version = "0.1.0"
description = ""
authors = ["GrimLefourbe <naw@grimlefourbe.xyz>"]
packages = [
    {include = "nawminator", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.12.0,<3.13"
pandas = "^2.2.2"
scipy = "^1.8.1"
loguru = "^0.6.0"
regex = "^2024.7.24"
pydantic = "^2.11.7"
pulp = "^3.2.2"

[tool.poetry.group.nmsite]
optional = true

[tool.poetry.group.nmsite.dependencies]
gradio = ">=6.16.0,<7.0.0"  # 6.11-6.15 froze on tab switch (gr.DataFrame in gr.Accordion bug, gradio-app/gradio#13285); fixed in 6.16.0 (PR #13240)
pyyaml = "^6.0.2"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = ">=24.4.2,<27.0.0"
pytest = "^8.3.1"
hypothesis = "^6.108.4"
pytest-playwright = "^0.6.0"

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--browser firefox"
markers = [
  "property: property-based tests",
  "ui: browser-driven UI behaviour tests",
]