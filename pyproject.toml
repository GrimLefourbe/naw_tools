[tool.poetry]
name = "nawminator"
version = "0.1.0"
description = ""
authors = ["GrimLefourbe <naw@grimlefourbe.xyz>"]
packages = [
    {include = "nawminator", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.12.0,<3.13"
pandas = "^2.2.2"
scipy = "^1.8.1"
loguru = "^0.6.0"
regex = "^2024.7.24"
pydantic = "^2.11.7"
pulp = "^3.2.2"

[tool.poetry.group.nmsite]
optional = true

[tool.poetry.group.nmsite.dependencies]
gradio = ">=6.10.0,<6.11.0"  # pinned: 6.11+ freezes on tab switch (gr.DataFrame in gr.Accordion bug, gradio-app/gradio#13285)
pyyaml = "^6.0.2"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
pytest = "^8.3.1"
hypothesis = "^6.108.4"

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
  "property: property-based tests",
]